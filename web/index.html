<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f7f7f8"
      media="(prefers-color-scheme: light)"
    />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="install できる Capsule を探す、分散型のアプリストア。"
    />
    <title>Takosumi Store</title>
    <link rel="canonical" href="https://store.takosumi.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="Takosumi Store" />
    <meta property="og:title" content="Takosumi Store" />
    <meta
      property="og:description"
      content="install できる Capsule を探す、分散型のアプリストア。"
    />
    <meta property="og:url" content="https://store.takosumi.com/" />
    <meta property="og:image" content="https://store.takosumi.com/og.png" />
    <meta
      property="og:image:alt"
      content="Takosumi Store, catalog for Takos Capsules"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Takosumi Store" />
    <meta
      name="twitter:description"
      content="install できる Capsule を探す、分散型のアプリストア。"
    />
    <meta name="twitter:image" content="https://store.takosumi.com/og.png" />
    <link rel="icon" type="image/png" href="/tako.png" />
    <link rel="apple-touch-icon" href="/tako.png" />
    <script>
      try {
        var t = localStorage.getItem("tcs.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.dataset.theme = t;
          var c = t === "light" ? "#f7f7f8" : "#0a0a0a";
          document
            .querySelectorAll('meta[name="theme-color"]')
            .forEach(function (m) {
              m.setAttribute("content", c);
            });
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
